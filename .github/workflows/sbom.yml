name: Software Bill of Materials

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source-sbom:
    name: Generate source dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate CycloneDX inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0, Syft 1.42.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/source-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate SBOM document
        env:
          SBOM_PATH: ${{ runner.temp }}/source-sbom.cdx.json
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ["SBOM_PATH"], encoding="utf-8") as stream:
              bom = json.load(stream)
          assert bom["bomFormat"] == "CycloneDX", "Unexpected SBOM format"
          assert bom.get("specVersion"), "Missing specification version"
          print(f"Source inventory: {len(bom.get('components', []))} detected components")
          PY
      - name: Upload SBOM for this commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/source-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
